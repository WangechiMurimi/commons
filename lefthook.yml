pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,json,css,md,yml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx,js}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
